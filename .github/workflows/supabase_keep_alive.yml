name: Supabase Keep Alive

on:
  schedule:
    # 7日間の利用実績を安定して作るため、1日3回DBへ到達する。
    # 日本時間 02:17 / 10:17 / 18:17（UTC 17:17 / 01:17 / 09:17）
    - cron: '17 1,9,17 * * *'
  workflow_dispatch: # 手動実行ボタンも残しておきます

jobs:
  supabase_ping:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Send Ping to Supabase API
        run: |
          curl --fail-with-body --retry 3 --max-time 30 -i -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/holdings?select=id&limit=1" \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"

      - name: Purge expired community data after its 30-day recovery period
        # secrets は if 条件内で直接参照できないため、環境変数を経由する。
        if: ${{ env.SUPABASE_SERVICE_ROLE_KEY != '' }}
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          curl --fail-with-body --retry 3 --max-time 30 -i -X POST "${{ secrets.SUPABASE_URL }}/rest/v1/rpc/purge_expired_community_accounts" \
          -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
          -H "Content-Type: application/json" \
          -d '{}'

      - name: Keep GitHub Actions alive
        uses: liskin/gh-workflow-keepalive@v1
